<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let lingaugens = Array();
        linguagens[0] = 'Dart';
        lingaugens[1] = 'PHP';
        lingaugens[2] = 'Java';
        linguagens[3] = 'Phyton';
        linguagens[4] = 'Perl';
        linguagens[5] = 'Ruby on Rails';
        lingaugens[6] = 'C ++';

        function mostrarListaLinguagens(){
            const container = document.getElementById('minhaDiv');

            for (var i = 0; i < linguagens.lenght; i++) {
                var tag = '<h5>' + i + '-' + linguagens[i] + '</h5>';

                container.innerHTML += tag;
            }
        }

        function posicaoLinguagens(){
            var indicie = prompt('Qual psoção da lista deseja consultar?');
            alert(linguagens[indicie]);
        }
    </script>
</head>
<body>
    <h1>Array de Linguagens</h1>

    <button onclick="mostrarLinguagens()">Criar Array</button> <br><br>
    <button onclick="posicaoLinguagens()">Posição do Array</button>

    <div id="minhaDiv"></div>
</body>
</html>
