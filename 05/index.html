<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="container">
    <h1>Lista de livros</h1>
    <div class="formulario">
        <label for="titulo">Titulo:</label>
        <input type="text" id="titulo" placeholder="Digite o titulo do livro">
        <label for="autor">Autor</label>
        <input type="text" id="ano" placeholder="Digite o ano de publicação">

        <button onclick="adicionarLivro()">Adicionar</button>

    </div>

    <hr>

    <div class="botoes">
        <button onclick="mostrarPosição()">Posição</button>
        <button onclick="removerUltimo()">Remover ultimo</button>
        <button onclick="limparLista()">Limpar</button>
        <button onclick="inverterLista()">Inverter</button>
    </div>

    <div id="lista"></div>

</div>

    <script>
let livros = [];

function adicionarLivro() {
const titulo = document.getElementById("titulo").value;
const autor = document.getElementById("autor").value;
const ano = document.getElementById("ano").value;

if (titulo === "" || autor === "" || ano === "") {
alert("Preencha todos os campos!");
return;
}

livros.push({
titulo: titulo,
autor: autor,
ano: ano
});

atualizarLista();

document.getElementById("titulo").value = "";
document.getElementById("autor").value = "";
document.getElementById("ano").value = "";
}

function atualizarLista() {
const lista = document.getElementById("lista");

lista.innerHTML = "";

livros.forEach((livro, index) => {
lista.innerHTML += `
<div class="livro">
${index + 1}. <strong>${livro.titulo}</strong>
- ${livro.autor} (${livro.ano})
</div>
`;
});
}

function mostrarPosicao() {
if (livros.length === 0) {
alert("A lista está vazia.");
return;
}

alert("Quantidade de livros: " + livros.length);
}

function removerUltimo() {
livros.pop();
atualizarLista();
}

function limparLista() {
livros = [];
atualizarLista();
}

function inverterLista() {
livros.reverse();
atualizarLista();
}
</script>

</body>
</html>
